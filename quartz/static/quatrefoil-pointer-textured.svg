<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <pattern id="ironTexture" patternUnits="userSpaceOnUse" width="64" height="64">
      <image href="data:image/jpeg;base64," width="64" height="64" preserveAspectRatio="xMidYMid slice"/>
    </pattern>
    <mask id="hollowMask">
      <rect width="32" height="32" fill="white"/>
      <circle cx="16" cy="16" r="3.5" fill="black"/>
    </mask>
  </defs>
  <!-- Shadow -->
  <g transform="translate(1,1)" opacity="0.3">
    <circle cx="16" cy="7" r="6" fill="black"/>
    <circle cx="25" cy="16" r="6" fill="black"/>
    <circle cx="16" cy="25" r="6" fill="black"/>
    <circle cx="7" cy="16" r="6" fill="black"/>
  </g>
  <!-- Main quatrefoil with texture and hollow center -->
  <g mask="url(#hollowMask)">
    <circle cx="16" cy="7" r="6" fill="url(#ironTexture)" stroke="#1a1a1a" stroke-width="0.4"/>
    <circle cx="25" cy="16" r="6" fill="url(#ironTexture)" stroke="#1a1a1a" stroke-width="0.4"/>
    <circle cx="16" cy="25" r="6" fill="url(#ironTexture)" stroke="#1a1a1a" stroke-width="0.4"/>
    <circle cx="7" cy="16" r="6" fill="url(#ironTexture)" stroke="#1a1a1a" stroke-width="0.4"/>
  </g>
</svg>
